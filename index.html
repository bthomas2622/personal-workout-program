<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Program</title>
    <link rel="stylesheet" href="styles.css?v=20260527">
</head>
<body>
    <div class="container">
        <header>
            <h1>Gym Program</h1>
            <p class="current-period" id="currentPeriod"></p>
            <div class="period-buttons">
                <button class="period-btn" data-period="0">Jan</button>
                <button class="period-btn" data-period="1">Feb</button>
                <button class="period-btn" data-period="2">Mar</button>
                <button class="period-btn" data-period="3">Apr</button>
                <button class="period-btn" data-period="4">May</button>
                <button class="period-btn" data-period="5">Jun</button>
                <button class="period-btn" data-period="6">Jul</button>
                <button class="period-btn" data-period="7">Aug</button>
                <button class="period-btn" data-period="8">Sep</button>
                <button class="period-btn" data-period="9">Oct</button>
                <button class="period-btn" data-period="10">Nov</button>
                <button class="period-btn" data-period="11">Dec</button>
            </div>
        </header>

        <div class="workouts-container">
            <div class="workout-card">
                <h2 id="workout1Title">Workout A</h2>
                <div class="workout-content" id="workout1Content">
                    <p>Loading...</p>
                </div>
            </div>

            <div class="workout-card">
                <h2 id="workout2Title">Workout B</h2>
                <div class="workout-content" id="workout2Content">
                    <p>Loading...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js?v=20260527"></script>
</body>
</html>
